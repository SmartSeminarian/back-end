    Concept:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        related_concepts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              relationship:
                type: string

    Problem:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        exampleInput:
          type: string
        exampleOutput:
          type: string

    SolutionSubmission:
      type: object
      properties:
        problemId:
          type: string
        solutionCode:
          type: string
      required:
        - problemId
        - solutionCode

    SolutionResponse:
      type: object
      properties:
        problemId:
          type: string
        evaluation:
          type: string
