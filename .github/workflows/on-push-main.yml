name: Build docker image

on:
  push:
    branches:
        - 'main'
        - 'cicd-workflow'
jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: krinkin/${{github.event.repository.name}}

      - name: Set enviroment
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> "$GITHUB_ENV"

      - name: Read enviroment
        shell: bash
        run: |
          echo "BRANCH: ${{ env.branch }}"
          echo "SHA_SHORT: ${{ env.sha_short }}"
          echo "secret: ${{ env.secret }}"
          echo "GITHUB_REF: ${{ github.repository_owner }}"
          echo "GITHUB_REF: ${{ github.event.repository.name }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: SmartSeminarian.${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Ping CI/CD to deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CICD_GITHUB_TOKEN }}
          repository: SmartSeminarian/cicd
          event-type: commit-to-branch
          client-payload: '{"owner": "${{ github.repository_owner }}", "repo": "${{ github.event.repository.name }}", "branch": "${{ env.branch }}",  "sha": "${{ env.sha_short }}"}'
