version: '3.9'

services:
    service:
        container_name: $CONTAINER_NAME
        image: krinkin/$PROJECT.$SERVICE_NAME:$BRANCH
#UNCOMMENT_ME_FOR_DEV        build:
#UNCOMMENT_ME_FOR_DEV          context: .
#UNCOMMENT_ME_FOR_DEV          dockerfile: ./Dockerfile
        ports:
            - "5000"
        depends_on:
            neo4j-db:
                condition: service_healthy
        links:
            - neo4j-db
        env_file:
            - ./.env
        volumes:
            - $CONTAINER_DATA:/data
            - $VERSION_FILE:/VERSION:ro
#UNCOMMENT_ME_FOR_DEV            - ./app:/app
        networks:
            - neo4j_network
        healthcheck:
            test: curl --fail http://api-stage.csai.site/version || exit 1
#UNCOMMENT_ME_FOR_DEV            test: curl --fail http://localhost:5000/version  || exit 1
            interval: 10s
            timeout: 10s
            retries: 3
            start_period: 3s
        restart: unless-stopped

    neo4j-db:
        container_name: graph_database
        image: neo4j:3.5
        restart: on-failure
        ports:
            - "7474:7474"
            - "7687:7687"
# To persist database data
#        volumes: 
#            - neo4j-db:/data
        env_file:
            - ./.env
        networks:
            - neo4j_network
        healthcheck:
            test: cypher-shell --username neo4j --password secret 'MATCH (n) RETURN COUNT(n);' # Checks if neo4j server is up and running
            interval: 10s
            timeout: 10s
            retries: 5
#DELETE_BLOCK_FOR_DEV
    tunnel:
        container_name:  ${CONTAINER_NAME}_tunnel
        depends_on:
            -   service
        env_file:
            - ./.env
        image: cloudflare/cloudflared:latest
        command: [ "tunnel",
                   "--no-autoupdate",
                   "run",
                   "--token",
                   "$CF_TOKEN"
        ]
#DELETE_BLOCK_FOR_DEV
networks:
    neo4j_network:
#volumes:
#    neo4j-db: